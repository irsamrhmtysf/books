<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1915" />
  <title>FOLIO — books</title>
  <meta name="description" content="Private shelf. Read Range, recall it, keep the note." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@380;520;640&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><b>FOLIO</b><span>books</span></div>
      <div class="tools">
        <button class="iconbtn" id="langBtn" type="button">EN</button>
        <button class="iconbtn" id="themeBtn" type="button">◐</button>
        <button class="primary" id="addBtn" type="button">+ Book</button>
      </div>
    </header>
    <section id="now" class="view on"></section>
    <section id="library" class="view"></section>
    <section id="recall" class="view"></section>
    <section id="search" class="view"></section>
    <section id="you" class="view"></section>
  </div>
  <nav class="nav">
    <button type="button" data-tab="now" class="on">⌂<small>Now</small></button>
    <button type="button" data-tab="library">▦<small>Shelf</small></button>
    <button type="button" data-tab="recall">↺<small>Recall</small></button>
    <button type="button" data-tab="search">⌕<small>Search</small></button>
    <button type="button" data-tab="you">◉<small>You</small></button>
  </nav>
  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
  <script src="js/catalog.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
