<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1915" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="FOLIO — a private book collection. Your shelf, your notes, your pace." />
<title>FOLIO — Private Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620;9..144,700&family=Outfit:wght@340;420;520;640&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f3eee4;
    --bg-2: #e7e0d2;
    --ink: #1c1915;
    --muted: #6e675c;
    --line: rgba(28,25,21,.12);
    --card: rgba(255,252,246,.78);
    --copper: #b5522a;
    --forest: #1f4d3c;
    --gold: #a6843d;
    --shadow: 0 18px 50px rgba(48,32,14,.12);
    --nav: rgba(243,238,228,.9);
    --rail: #d9cbb6;
    --good: #2f6b4f;
  }
  [data-theme="night"] {
    --bg: #12110e;
    --bg-2: #1c1a16;
    --ink: #f4ecdf;
    --muted: #a89f90;
    --line: rgba(244,236,223,.12);
    --card: rgba(32,29,24,.86);
    --copper: #e08a62;
    --forest: #8fbfa4;
    --gold: #e2c27a;
    --shadow: 0 18px 50px rgba(0,0,0,.4);
    --nav: rgba(18,17,14,.9);
    --rail: #2a261f;
    --good: #8fbfa4;
  }
  [data-theme="sepia"] {
    --bg: #efe2c6;
    --bg-2: #e4d2ad;
    --ink: #3a2a16;
    --muted: #7a6244;
    --line: rgba(58,42,22,.14);
    --card: rgba(255,246,226,.8);
    --copper: #9a4322;
    --forest: #3d5a3a;
    --gold: #8d6a2f;
    --nav: rgba(239,226,198,.92);
    --rail: #d8c09a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Outfit, system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(181,82,42,.08), transparent 50%),
      radial-gradient(900px 400px at 100% 0%, rgba(31,77,60,.08), transparent 46%),
      var(--bg);
    color: var(--ink);
    min-height: 100dvh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 1120px; margin: 0 auto; padding: 18px 18px 108px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b {
    font-family: Fraunces, serif; font-size: 28px; letter-spacing: -.03em; font-weight: 620;
  }
  .brand span { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .iconbtn, .chip, .seg button, .primary, .ghost {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 12px; transition: .18s ease;
  }
  .iconbtn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
  .iconbtn:hover, .chip:hover, .ghost:hover { transform: translateY(-1px); }
  .primary { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 520; }
  .view { display: none; animation: rise .35s ease; }
  .view.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1, h2, h3 { font-family: Fraunces, serif; font-weight: 620; letter-spacing: -.02em; margin: 0; }
  .kicker { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
  .hero {
    display: grid; grid-template-columns: 148px 1fr; gap: 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 28px;
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .hero .meta { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .hero h1 { font-size: clamp(28px, 4vw, 44px); line-height: .95; margin: 4px 0 8px; }
  .sub { color: var(--muted); line-height: 1.45; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  }
  .stat b { display: block; font-family: Fraunces, serif; font-size: 26px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .section-h { display: flex; justify-content: space-between; align-items: end; margin: 8px 0 12px; }
  .hscroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
  .hscroll::-webkit-scrollbar { height: 0; }
  .shelf {
    background: linear-gradient(180deg, transparent 78%, var(--rail) 78%, var(--rail) 86%, transparent 86%);
    padding: 8px 4px 22px; display: flex; gap: 14px; overflow-x: auto;
  }
  .book {
    width: 112px; height: 168px; flex: 0 0 auto; border-radius: 3px 8px 8px 3px;
    position: relative; overflow: hidden; scroll-snap-align: start;
    box-shadow: 8px 12px 20px rgba(40,24,8,.18), inset -8px 0 12px rgba(0,0,0,.12);
    background: #24382f; color: #f7f1e6; transform: translateY(0); transition: .2s ease;
  }
  .book:hover { transform: translateY(-8px) rotate(-1deg); }
  .book.inert { pointer-events: none; }
  .book img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book .fallback {
    position: absolute; inset: 0; padding: 12px 10px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .book .fallback small { opacity: .75; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
  .book .fallback strong { font-family: Fraunces, serif; font-size: 16px; line-height: 1.05; }
  .book .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
  .book .bar i { display: block; height: 100%; background: #f3d48a; }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.22); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px;
    text-align: left; cursor: pointer;
  }
  .card .book { width: 100%; height: 210px; }
  .card p { margin: 10px 2px 0; }
  .card .t { font-weight: 620; line-height: 1.2; }
  .card .a { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: transparent; }
  .searchbox {
    width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 18px;
    padding: 14px 16px; outline: none; margin-bottom: 14px;
  }
  .sheet {
    position: fixed; inset: 0; background: rgba(18,14,10,.46); z-index: 40;
    display: none; align-items: end; justify-content: center;
  }
  .sheet.on { display: flex; }
  .panel {
    width: min(860px, 100%); max-height: min(92dvh, 920px); overflow: auto;
    background: var(--bg); border-radius: 28px 28px 0 0; padding: 18px 18px 28px;
    box-shadow: var(--shadow); animation: sheet .28s ease;
  }
  @keyframes sheet { from { transform: translateY(24px); opacity: .6; } }
  .panel-h { display: grid; grid-template-columns: 120px 1fr; gap: 16px; }
  .close { float: right; }
  .seg { display: flex; background: var(--bg-2); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; }
  .seg button.on { background: var(--card); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  input[type="range"] { width: 100%; accent-color: var(--copper); }
  textarea, .field {
    width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px;
    outline: none;
  }
  textarea { min-height: 110px; resize: vertical; }
  .quote {
    border-left: 3px solid var(--copper); padding: 4px 0 4px 12px; margin: 10px 0; color: var(--ink);
    font-family: Fraunces, serif; font-size: 18px; line-height: 1.35;
  }
  .map { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .node {
    text-align: left; border-radius: 16px; padding: 12px; border: 1px solid var(--line); background: var(--card);
  }
  .node b { display: block; margin-bottom: 4px; }
  .node span { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 30;
    width: min(560px, calc(100% - 20px));
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--nav); backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 22px; padding: 6px;
    box-shadow: var(--shadow);
  }
  .nav button { border: 0; background: transparent; border-radius: 16px; padding: 8px 4px; color: var(--muted); }
  .nav button.on { background: var(--ink); color: var(--bg); }
  .nav small { display: block; font-size: 11px; }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .pill { font-size: 12px; border-radius: 999px; padding: 4px 8px; background: var(--bg-2); }
  @media (max-width: 720px) {
    .hero, .panel-h { grid-template-columns: 96px 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .formgrid { grid-template-columns: 1fr; }
    .brand span { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <b>FOLIO</b>
      <span>Private library</span>
    </div>
    <div class="tools">
      <button class="iconbtn" id="langBtn" title="Language">EN</button>
      <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
      <button class="primary" id="addBtn">+ Book</button>
    </div>
  </header>

  <section id="now" class="view on"></section>
  <section id="library" class="view"></section>
  <section id="search" class="view"></section>
  <section id="shelves" class="view"></section>
  <section id="you" class="view"></section>
</div>

<nav class="nav">
  <button data-tab="now" class="on">⌂<small data-i="now">Now</small></button>
  <button data-tab="library">▦<small data-i="library">Library</small></button>
  <button data-tab="search">⌕<small data-i="search">Search</small></button>
  <button data-tab="shelves">☰<small data-i="shelves">Shelves</small></button>
  <button data-tab="you">◉<small data-i="you">You</small></button>
</nav>

<div class="sheet" id="sheet">
  <div class="panel" id="panel"></div>
</div>

const SEED = [
  {

  {

    status:"want", progress:8, fit:5, shelf:"Foundations",
    tags:["history","institutions","singapore"],
    accent:"#8a3b24",
    why:"A field manual for institutions: merit, education, anti-corruption, and pragmatism over ideology.",
    blurb:"Singapore’s rise told by the person who ran it. Less romance, more constraints: water, talent, trust, and the cost of corruption.",
    quotes:["A nation is great not by its size alone. It is the will, the cohesion, the stamina of its people."],
    notes:"",
    chapters:[
      ["Merit","Put competence above kinship and slogans."],
      ["Education","The scarce resource was trained people, not speeches."],
      ["Clean institutions","Corruption is a tax on every future project."],
      ["Pragmatism","Copy what works, discard what does not, keep testing."]
    ]
  },
  {
    id:"deep", title:"Deep Work", author:"Cal Newport", year:2016, pages:296, isbn:"9781455586691",
    status:"finished", progress:100, fit:4, shelf:"Craft",
    tags:["focus","work"],
    accent:"#24324a",
    why:"A counterweight to range: once the match is found, protect the hours.",
    blurb:"Undistracted stretches are where rare skill is actually built. Range chooses the room. Deep work stays in it.",
    quotes:["Clarity about what matters provides clarity about what does not."],
    notes:"",

  },
  {
    id:"atomic", title:"Atomic Habits", author:"James Clear", year:2018, pages:320, isbn:"9780735211292",
    status:"finished", progress:100, fit:4, shelf:"Craft",
    tags:["habits"],
    accent:"#b5522a",
    why:"Small systems for a shelf that has to survive busy weeks.",

    chapters:[["Cue","Make the book the first thing on the desk."],["Identity","I am someone who finishes the chapter."]]
  },
  {

    status:"reading", progress:27, fit:5, shelf:"Ideas",
    tags:["learning","mastery"],
    accent:"#3d4a2a",
    why:"How a chess kid and a martial artist moved skill across domains.",
    blurb:"Presence, incremental theory, and the willingness to lose the form you already know.",

    notes:"",

  },
  {
    id:"kahneman", title:"Thinking, Fast and Slow", author:"Daniel Kahneman", year:2011, pages:499, isbn:"9780374275631",
    status:"want", progress:0, fit:4, shelf:"Ideas",
    tags:["judgment"],

    why:"The bias book that makes wicked problems visible.",
    blurb:"System 1 is fast and sure. System 2 is slow and lazy. Most errors are confidence, not ignorance.",

  {

    accent:"#222",

  },
  {
    id:"design", title:"The Design of Everyday Things", author:"Don Norman", year:2013, pages:368, isbn:"9780465050659",

    tags:["design","product"],
    accent:"#b4532a",
    why:"The product book. If a control needs a label, the form failed.",
    blurb:"Affordances, signifiers, feedback, mapping. The reason apps feel obvious or hostile.",
    quotes:["Design is really an act of communication."],
    notes:"",
    chapters:[["Affordances","What the object invites."],["Feedback","The system must answer."]]
  },
  {
    id:"anti", title:"Antifragile", author:"Nassim Nicholas Taleb", year:2012, pages:519, isbn:"9780812979688",
    status:"want", progress:0, fit:4, shelf:"Ideas",
    tags:["risk"],
    accent:"#3a3228",
    why:"Optionality and skin in the game. A loud neighbor to Range.",
    blurb:"Some things gain from disorder. Protect the downside, keep the upside open.",
    quotes:[],
    notes:"",
    chapters:[["Fragility","Hates volatility."],["Optionality","Small bets, uncapped upside."]]
  },
  {
    id:"super", title:"Superforecasting", author:"Philip Tetlock", year:2015, pages:352, isbn:"9780804136693",
    status:"want", progress:0, fit:4, shelf:"Ideas",
    tags:["judgment"],
    accent:"#245c4a",
    why:"How foxes beat hedgehogs. Range, measured.",
    blurb:"Good forecasters update, break problems apart, and keep score. Hedgehogs have one big idea and a confident voice.",
    quotes:["Beliefs are hypotheses to be tested, not treasures to be guarded."],
    notes:"",
    chapters:[["Foxes","Many small models."],["Scorekeeping","If you do not measure, you only remember the hits."]]

];

const state = load();
let tab = "now";
let filter = "all";
let shelfFilter = null;
let lang = state.lang || "en";
let theme = state.theme || "paper";

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { books: SEED, shelves: ["Ideas","Foundations","Craft","Study","Build"], opened: Date.now(), days: [today()], lang:"en", theme:"paper" };
    const data = JSON.parse(raw);
    data.books = data.books && data.books.length ? data.books : SEED;
    data.shelves = data.shelves || ["Ideas","Craft"];
    data.days = data.days || [today()];
    return data;
  } catch(e) {
    return { books: SEED, shelves: ["Ideas","Craft"], opened: Date.now(), days:[today()], lang:"en", theme:"paper" };
  }
}
function save(){
  state.lang = lang; state.theme = theme;
  localStorage.setItem(KEY, JSON.stringify(state));
}
function today(){ return new Date().toISOString().slice(0,10); }
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function cover(book){
  return book.isbn ? `https://covers.openlibrary.org/b/isbn/${book.isbn}-L.jpg` : "";
}
function streak(){
  const set = new Set(state.days || []);
  let n = 0;
  const d = new Date();
  for (let i=0;i<365;i++){
    const key = d.toISOString().slice(0,10);
    if (!set.has(key)) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function touch(){
  state.days = state.days || [];
  if (!state.days.includes(today())) state.days.push(today());
  save();
}
function bookEl(book, tall){
  const pct = Math.max(0, Math.min(100, book.progress||0));
  return `<button class="book" style="height:${tall?210:168}px;background:${book.accent}" data-open="${book.id}" aria-label="${book.title}">
    <span class="spine"></span>
    <img alt="" src="${cover(book)}" onerror="this.style.display='none'" />
    <span class="fallback"><small>${book.author.split(' ').slice(-1)}</small><strong>${book.title}</strong></span>
    <span class="bar"><i style="width:${pct}%"></i></span>
  </button>`;
}
function statusLabel(s){ return t(s === "reading" ? "reading" : s === "want" ? "want" : "finished"); }

function renderNow(){
  const reading = state.books.filter(b => b.status === "reading").sort((a,b)=>b.progress-a.progress);
  const hero = reading[0] || state.books[0];
  const pages = state.books.reduce((s,b)=>s+Math.round((b.pages||0)*(b.progress||0)/100),0);
  const fit = Math.round(state.books.reduce((s,b)=>s+(b.fit||0),0) / state.books.length * 10) / 10;
  document.getElementById("now").innerHTML = `
    <div class="kicker">${t("continue")}</div>
    <article class="hero">
      ${bookEl(hero, true)}
      <div class="meta">
        <div class="kicker">${statusLabel(hero.status)} · ${hero.progress||0}%</div>
        <h1>${hero.title}</h1>
        <div class="sub">${hero.author} · ${hero.year}</div>
        <p class="sub">${hero.why}</p>
        <div class="row">
          <button class="primary" data-open="${hero.id}">${t("open")}</button>
          <span class="pill">${hero.shelf}</span>
        </div>
      </div>
    </article>
    <div class="stats">
      <div class="stat"><b>${state.books.length}</b><span>${t("books")}</span></div>
      <div class="stat"><b>${pages}</b><span>${t("pages")}</span></div>
      <div class="stat"><b>${streak()}</b><span>${t("streak")}</span></div>
      <div class="stat"><b>${fit}</b><span>${t("fit")}</span></div>
    </div>
    <div class="section-h"><h2>${t("upnext")}</h2></div>
    <div class="shelf">${state.books.map(b => bookEl(b)).join("")}</div>
  `;
}
function renderLibrary(){
  const chips = ["all","reading","want","finished"].map(id =>
    `<button class="chip ${filter===id?'on':''}" data-filter="${id}">${t(id)}</button>`).join("");
  let list = state.books.filter(b => filter==="all" ? true : b.status===filter);
  if (shelfFilter) list = list.filter(b => b.shelf === shelfFilter);
  document.getElementById("library").innerHTML = `
    <div class="section-h"><div><div class="kicker">${t("library")}</div><h2>${shelfFilter || t("all")}</h2></div>
      <button class="ghost" id="clearShelf">${shelfFilter ? "×" : ""}</button></div>
    <div class="chips">${chips}</div>
    ${list.length ? `<div class="grid">${list.map(b => `
      <div class="card" data-open="${b.id}" role="button" tabindex="0">
        ${bookEl(b, true).replace("class=\"book\"", "class=\"book inert\"")}
        <p class="t">${b.title}</p>
        <p class="a">${b.author}</p>
      </div>`).join("")}</div>` : `<p class="note">${t("empty")}</p>`}
  `;
}
function renderSearch(){
  const q = (document.getElementById("q")?.value || "").trim();
  document.getElementById("search").innerHTML = `
    <div class="kicker">${t("search")}</div>
    <h2 style="margin-bottom:12px">Find a book or an idea</h2>
    <input class="searchbox" id="q" placeholder="${t("searchph")}" value="${q.replace(/"/g,""")}" />
    <div id="sres"></div>`;
  paintSearch();
  document.getElementById("q").addEventListener("input", paintSearch);
}
function paintSearch(){
  const q = (document.getElementById("q").value || "").toLowerCase();
  const list = state.books.filter(b => !q || [b.title,b.author,b.shelf,(b.tags||[]).join(" "), b.why, b.blurb].join(" ").toLowerCase().includes(q));
  document.getElementById("sres").innerHTML = list.map(b => `
    <button class="card" data-open="${b.id}" style="display:grid;grid-template-columns:72px 1fr;gap:12px;width:100%;margin-bottom:10px">
      <span class="book" style="width:72px;height:108px;background:${b.accent}"><span class="fallback"><strong>${b.title}</strong></span></span>
      <span><b>${b.title}</b><br><span class="note">${b.author} · ${b.shelf}<br>${b.why}</span></span>
    </button>`).join("") || `<p class="note">${t("empty")}</p>`;
}
function renderShelves(){
  const counts = {};
  state.books.forEach(b => counts[b.shelf] = (counts[b.shelf]||0)+1);
  document.getElementById("shelves").innerHTML = `
    <div class="kicker">${t("shelves")}</div>
    <h2 style="margin-bottom:12px">Rooms in the library</h2>
    <div class="grid">
      ${state.shelves.map(s => `<button class="card" data-shelf="${s}"><b style="font-family:Fraunces,serif;font-size:28px">${counts[s]||0}</b><p class="t">${s}</p><p class="a">Open shelf</p></button>`).join("")}
    </div>
    <div class="row" style="margin-top:16px">
      <input class="field" id="newShelf" placeholder="New shelf name" style="max-width:280px" />
      <button class="primary" id="addShelf">Add shelf</button>
    </div>`;
  document.getElementById("addShelf").onclick = () => {
    const name = document.getElementById("newShelf").value.trim();
    if (!name || state.shelves.includes(name)) return;
    state.shelves.push(name); save(); renderShelves();
  };
}
function renderYou(){
  const pages = state.books.reduce((s,b)=>s+Math.round((b.pages||0)*(b.progress||0)/100),0);
  document.getElementById("you").innerHTML = `
    <div class="kicker">${t("you")}</div>
    <h2>A shelf, not a store</h2>
    <p class="sub" style="max-width:62ch">FOLIO is a private collection. Apple Books gave the paper and the continue-reading pull. Google Books gave search and shelves. The new piece is the companion: why the book is here, the fit, the note, the map. Nothing is sold. Nothing leaves this browser unless you export it.</p>
    <div class="stats" style="margin-top:16px">
      <div class="stat"><b>${state.books.length}</b><span>${t("books")}</span></div>
      <div class="stat"><b>${pages}</b><span>${t("pages")}</span></div>
      <div class="stat"><b>${streak()}</b><span>${t("streak")}</span></div>
      <div class="stat"><b>${state.books.filter(b=>b.status==="finished").length}</b><span>${t("finished")}</span></div>
    </div>
    <div class="row">
      <button class="primary" id="exp">${t("export")}</button>
      <button class="ghost" id="imp">${t("import")}</button>
      <button class="ghost" id="reset">${t("reset")}</button>
    </div>
    <p class="note" style="margin-top:14px">${t("save")}. Sample shelf includes Range — the book that opened this project — plus foundations, craft, and build.</p>
    <input id="file" type="file" accept="application/json" hidden />
  `;
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "folio-library.json"; a.click();
  };
  document.getElementById("imp").onclick = () => document.getElementById("file").click();
  document.getElementById("file").onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { const data = JSON.parse(reader.result); if (data.books) { Object.assign(state, data); save(); go(tab); } }
      catch(err){ alert("That file is not a FOLIO shelf."); }
    };
    reader.readAsText(file);
  };
  document.getElementById("reset").onclick = () => {
    if (!confirm("Replace this shelf with the sample collection?")) return;
    state.books = SEED; state.shelves = ["Ideas","Foundations","Craft","Study","Build"]; save(); go(tab);
  };
}

function openBook(id){
  const b = state.books.find(x => x.id === id); if (!b) return;
  touch();
  const chapters = (b.chapters||[]).map(([h,d],i) => `<button class="node" data-node="${i}"><b>${h}</b><span>${d}</span></button>`).join("");
  document.getElementById("panel").innerHTML = `
    <button class="iconbtn close" id="close">×</button>
    <div class="panel-h">
      ${bookEl(b, true)}
      <div>
        <div class="kicker">${b.shelf} · ${b.year} · ${b.pages} pp</div>
        <h2 style="font-size:34px">${b.title}</h2>
        <p class="sub">${b.author}</p>
        <div class="seg" style="margin-top:10px">
          ${["reading","want","finished"].map(s => `<button data-status="${s}" class="${b.status===s?"on":""}">${statusLabel(s)}</button>`).join("")}
        </div>
      </div>
    </div>
    <p style="margin-top:16px"><b>${b.progress||0}%</b> · ${t("why")}</p>
    <input type="range" min="0" max="100" value="${b.progress||0}" id="prog" />
    <p class="sub">${b.why}</p>
    <p>${b.blurb}</p>
    <div class="row">${(b.tags||[]).map(tag => `<span class="pill">${tag}</span>`).join("")}
      <label class="pill">Fit <input id="fit" type="number" min="1" max="5" value="${b.fit||3}" style="width:42px;border:0;background:transparent" /></label>
    </div>
    ${(b.quotes||[]).map(q => `<div class="quote">${q}</div>`).join("")}
    <h3 style="margin:16px 0 8px">${t("companion")}</h3>
    <div class="map">${chapters || `<p class="note">No map yet. The note below is the companion.</p>`}</div>
    <h3 style="margin:16px 0 8px">${t("note")}</h3>
    <textarea id="note">${b.notes||""}</textarea>
    <div class="row">
      <button class="primary" id="saveNote">Save note</button>
      <button class="ghost" id="del">Remove</button>
    </div>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("close").onclick = closeSheet;
  document.getElementById("prog").oninput = (e) => { b.progress = +e.target.value; if (b.progress===100) b.status="finished"; save(); };
  document.querySelectorAll("[data-status]").forEach(btn => btn.onclick = () => { b.status = btn.dataset.status; save(); openBook(id); });
  document.getElementById("fit").onchange = (e) => { b.fit = +e.target.value; save(); };
  document.getElementById("saveNote").onclick = () => { b.notes = document.getElementById("note").value; save(); document.getElementById("saveNote").textContent = "Saved"; };
  document.getElementById("del").onclick = () => { if (!confirm("Remove this book from the shelf?")) return; state.books = state.books.filter(x => x.id !== id); save(); closeSheet(); go(tab); };
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); go(tab); }
function openAdd(){
  document.getElementById("panel").innerHTML = `
    <button class="iconbtn close" id="close">×</button>
    <div class="kicker">${t("add")}</div>
    <h2 style="margin-bottom:12px">Put a book on the shelf</h2>
    <div class="formgrid">
      <input class="field" id="f-title" placeholder="Title" />
      <input class="field" id="f-author" placeholder="Author" />
      <input class="field" id="f-year" placeholder="Year" inputmode="numeric" />
      <input class="field" id="f-pages" placeholder="Pages" inputmode="numeric" />
      <input class="field" id="f-isbn" placeholder="ISBN (for cover)" />
      <select class="field" id="f-shelf">${state.shelves.map(s => `<option>${s}</option>`).join("")}</select>
      <select class="field" id="f-status"><option value="want">${t("want")}</option><option value="reading">${t("reading")}</option><option value="finished">${t("finished")}</option></select>
      <input class="field" id="f-why" placeholder="Why it is here" />
    </div>
    <div class="row"><button class="primary" id="saveBook">${t("add")}</button></div>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("close").onclick = closeSheet;
  document.getElementById("saveBook").onclick = () => {
    const title = document.getElementById("f-title").value.trim();
    const author = document.getElementById("f-author").value.trim();
    if (!title || !author) return;
    const accents = ["#1f4d3c","#b5522a","#24324a","#5c3d2e","#1e4a5c"];
    state.books.unshift({
      id: "b"+Date.now(), title, author,
      year: +document.getElementById("f-year").value || new Date().getFullYear(),
      pages: +document.getElementById("f-pages").value || 0,
      isbn: document.getElementById("f-isbn").value.replace(/[^0-9X]/gi,""),
      status: document.getElementById("f-status").value,
      progress: document.getElementById("f-status").value === "finished" ? 100 : 0,
      fit: 3, shelf: document.getElementById("f-shelf").value,
      tags: [], accent: accents[state.books.length % accents.length],
      why: document.getElementById("f-why").value.trim() || "Added by hand.",
      blurb: "", quotes: [], notes: "", chapters: []
    });
    save(); closeSheet(); go("library");
  };
}

function go(next){
  tab = next;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.getElementById(tab).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  if (tab==="now") renderNow();
  if (tab==="library") renderLibrary();
  if (tab==="search") renderSearch();
  if (tab==="shelves") renderShelves();
  if (tab==="you") renderYou();
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
}
document.body.addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]");
  if (open) { openBook(open.dataset.open); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; shelfFilter = null; renderLibrary(); return; }
  const s = e.target.closest("[data-shelf]");
  if (s) { shelfFilter = s.dataset.shelf; filter = "all"; go("library"); }
  if (e.target.id === "clearShelf") { shelfFilter = null; renderLibrary(); }
});
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
document.getElementById("addBtn").onclick = openAdd;
document.getElementById("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
document.getElementById("themeBtn").onclick = () => {
  theme = theme === "paper" ? "night" : theme === "night" ? "sepia" : "paper";
  document.documentElement.dataset.theme = theme === "paper" ? "" : theme;
  save();
};
document.getElementById("langBtn").onclick = () => {
  lang = lang === "en" ? "id" : "en";
  document.getElementById("langBtn").textContent = lang.toUpperCase();
  save(); go(tab);
};
document.documentElement.dataset.theme = theme === "paper" ? "" : theme;
document.getElementById("langBtn").textContent = lang.toUpperCase();
touch();
go("now");
</script>
</body>
</html>
